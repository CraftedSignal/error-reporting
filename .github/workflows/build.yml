name: Build

on:
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Container Builds and Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Image metadata
        id: image-meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build function image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: runtime-function
          push: false
          load: true
          tags: craftedsignal-error-reporting-function:test
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.image-meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan function image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "craftedsignal-error-reporting-function:test"
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
          exit-code: "1"

      - name: Build resolver image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: runtime-resolver
          push: false
          load: true
          tags: craftedsignal-error-reporting-resolver:test
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.image-meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan resolver image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "craftedsignal-error-reporting-resolver:test"
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
          exit-code: "1"
