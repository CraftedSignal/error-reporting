name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag on main to publish (for example v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  request-release:
    name: Request trusted main release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # Tag events have a tag OIDC subject, which the cloud identity must reject.
      # Dispatch the trusted main workflow; this job never obtains cloud auth.
      - name: Dispatch main workflow with the requested tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid release version tag"
            exit 1
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main --field "tag=$RELEASE_TAG"

  prepare:
    name: Verify release source on main
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify workflow policy
        run: ruby .github/scripts/verify-workflow-policy.rb

      - name: Test release source validation
        run: python3 -m unittest discover -s .github/tests -p '*_test.py'

      - name: Verify requested release tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/release-source.py --tag "$RELEASE_TAG"

  validate:
    name: Release validation
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Verify Dependabot runtime image coverage
        run: ruby .github/scripts/verify-dependabot-images.rb

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: true

      - name: Run release tests and vet
        run: |
          go test -race ./...
          go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15.0
          args: --config=.github/golangci.yml --timeout=15m

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

  release:
    name: Build and Push ${{ matrix.image }}
    needs: [prepare, validate]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: function
            target: runtime-function
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Image metadata
        id: image-meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: |
            ${{ vars.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/error-reporting/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
            ${{ vars.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/error-reporting/${{ matrix.image }}:latest
          build-args: |
            VCS_REF=${{ needs.prepare.outputs.source_sha }}
            BUILD_DATE=${{ steps.image-meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ vars.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/error-reporting/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
          exit-code: "1"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        env:
          ARTIFACT_REGISTRY_HOST: ${{ vars.ARTIFACT_REGISTRY_HOST }}
        run: gcloud auth configure-docker "$ARTIFACT_REGISTRY_HOST" --quiet

      - name: Push scanned image
        env:
          IMAGE: ${{ vars.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/error-reporting/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
          LATEST_IMAGE: ${{ vars.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/error-reporting/${{ matrix.image }}:latest
        run: |
          docker push "$IMAGE"
          docker push "$LATEST_IMAGE"

  notify-failure:
    name: Notify release failure
    needs: [prepare, validate, release]
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.prepare.result == 'failure' || needs.validate.result == 'failure' || needs.release.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
      RELEASE_REF: ${{ inputs.tag }}
    steps:
      - name: Notify Slack on failure
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          MSG="❌ error-reporting release failed for $RELEASE_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [[ "$SLACK_WEBHOOK_URL" == xoxb-* ]]; then
            curl -fsSL -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $SLACK_WEBHOOK_URL" \
              --data "$(jq -cn --arg channel "$SLACK_CHANNEL" --arg text "$MSG" '{channel: $channel, text: $text}')" \
              https://slack.com/api/chat.postMessage
          else
            curl -fsSL -X POST -H 'Content-Type: application/json' \
              --data "$(jq -cn --arg text "$MSG" '{text: $text}')" \
              "$SLACK_WEBHOOK_URL"
          fi
